<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ board_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="sim-banner" class="sim-banner" style="display:none;">
    &#9888; SIMULATED DATA -- for preview only, not your real schedule.
    <a href="{{ url_for('calendar_view') }}">switch back</a>
  </div>
  <header class="board-header">
    <div class="title-row">
      <h1>{{ board_title }}</h1>
      <img id="heartbeat" class="heartbeat" src="{{ url_for('static', filename='header.gif') }}"
           alt="Live" title="Live -- calendar refreshing normally">
    </div>
    <div id="clock">--:--:--</div>
  </header>

  <main class="board">
    <table class="flifo-table">
      <thead>
        <tr>
          <th class="col-airline">Airline</th>
          <th class="col-flight">Flight</th>
          <th class="col-code">From</th>
          <th class="col-time">Departs</th>
          <th class="col-gate">Gate</th>
          <th class="col-code">To</th>
          <th class="col-time">Arrives</th>
          <th class="col-gate">Gate</th>
          <th class="col-status">Status</th>
        </tr>
      </thead>
      <tbody id="flifo-rows">
        <!-- rendered by renderTable() -->
      </tbody>
    </table>
  </main>

  <nav class="board-nav">
    <button type="button" id="nav-back" class="nav-btn" title="Previous flight record" aria-label="Previous flight record">&#8592;</button>
    <button type="button" id="nav-current" class="nav-btn nav-btn-current is-live" title="Return to the current flight">Current Flight</button>
    <button type="button" id="nav-forward" class="nav-btn" title="Next flight record" aria-label="Next flight record">&#8594;</button>
  </nav>

  <footer class="board-footer">
    <span id="last-updated">Last updated: --</span>
    <a href="{{ url_for('calendar_view') }}">calendar / debug view</a>
  </footer>

  <script>
    const REFRESH_MS = 30 * 1000; // client poll of /api/status + /api/timeline
    // How many flight/block records the board shows at once -- user
    // configurable from the debug page's "Board Display" section, mainly
    // for bigger physical displays that can fit more than the default 5.
    const ROWS = {{ board_rows }};
    const UA_LOGO_URL = "{{ url_for('static', filename='ua_white.png') }}";
    // The heartbeat gif goes stale if the calendar hasn't refreshed
    // successfully within 2x the server's own refresh interval -- generous
    // enough to not flicker on a single slow cycle, tight enough to catch a
    // genuinely stuck ingest.
    const STALE_AFTER_MS = {{ refresh_interval_minutes }} * 60 * 1000 * 2;
    // Same grace window select_current_and_next() uses server-side to decide
    // a flight has expired (arrived + this many minutes). Used client-side
    // to keep the live lookahead rows (2-5) in agreement with the backend's
    // own current/next selection -- see liveDisplayList() below.
    const GRACE_MS = {{ grace_minutes }} * 60 * 1000;

    // `iso` already carries the correct UTC offset for whichever airport it
    // belongs to (the backend computes it via that airport's own IANA zone --
    // see parser.py / models.FlightEvent.effective_*_dt_utc()). But
    // toLocaleTimeString() with no explicit timeZone renders using the
    // *viewing device's own* system timezone instead, silently discarding
    // that -- harmless only when the device happens to sit in the same zone
    // as the flight. Passing `tz` (the flight's dep_tz/arr_tz) pins the
    // render to the airport's own local time regardless of what timezone
    // the board itself (or whatever's viewing it) is set to.
    function fmtTime(iso, tz) {
      if (!iso) return "--:--";
      const d = new Date(iso);
      const opts = { hour: "2-digit", minute: "2-digit" };
      if (tz) opts.timeZone = tz;
      return d.toLocaleTimeString([], opts);
    }

    function fmtDate(iso, tz) {
      if (!iso) return "";
      const d = new Date(iso);
      const opts = { day: "2-digit", month: "short" };
      if (tz) opts.timeZone = tz;
      return d.toLocaleDateString([], opts);
    }

    function renderRow(flight, isCurrent) {
      const rowClass = "flifo-row" + (isCurrent ? " row-current" : "");

      if (!flight) {
        return `
          <tr class="${rowClass} row-empty">
            <td class="col-airline"></td>
            <td colspan="8" class="empty-cell">&mdash;</td>
          </tr>`;
      }

      const airlineCell = `<td class="col-airline"><img src="${UA_LOGO_URL}" class="airline-logo" alt="United"></td>`;

      if (flight.event_type === "BLOCK") {
        return `
          <tr class="${rowClass}">
            ${airlineCell}
            <td class="col-flight">&mdash;</td>
            <td colspan="7" class="block-cell">${flight.display_text}</td>
          </tr>`;
      }

      // Collapse any run of non-alphanumeric characters (spaces, slashes --
      // e.g. "TAXIING/LEFT GATE") into a single underscore for the CSS
      // class name; a plain single-space replace would miss the slash and
      // any status with more than one space.
      const statusClass = "status-" + (flight.status || "ON TIME").replace(/[^A-Z0-9]+/gi, "_");

      return `
        <tr class="${rowClass}">
          ${airlineCell}
          <td class="col-flight">${flight.flight_number}</td>
          <td class="col-code">${flight.dep_code}</td>
          <td class="col-time">
            <div class="cell-time">${fmtTime(flight.dep_dt_local, flight.dep_tz)}</div>
            <div class="cell-date">${fmtDate(flight.dep_dt_local, flight.dep_tz)}</div>
          </td>
          <td class="col-gate">${flight.dep_gate ? "Gate " + flight.dep_gate : "No Gate"}</td>
          <td class="col-code">${flight.arr_code}</td>
          <td class="col-time">
            <div class="cell-time">${fmtTime(flight.arr_dt_local, flight.arr_tz)}</div>
            <div class="cell-date">${fmtDate(flight.arr_dt_local, flight.arr_tz)}</div>
          </td>
          <td class="col-gate">${flight.arr_gate ? "Gate " + flight.arr_gate : "No Gate"}</td>
          <td class="col-status"><span class="status-badge ${statusClass}">${flight.status}</span></td>
        </tr>`;
    }

    function updateHeartbeat(lastRefresh) {
      const heartbeat = document.getElementById("heartbeat");
      const ok = lastRefresh
        && lastRefresh.success
        && (Date.now() - new Date(lastRefresh.fetched_at).getTime()) < STALE_AFTER_MS;
      heartbeat.classList.toggle("stale", !ok);
      if (ok) {
        heartbeat.title = "Live -- calendar refreshing normally (last: "
          + new Date(lastRefresh.fetched_at).toLocaleTimeString() + ")";
      } else if (lastRefresh) {
        heartbeat.title = (lastRefresh.success ? "Stale -- no recent refresh" : "Stale -- last refresh failed: " + (lastRefresh.error || "unknown error"))
          + " (last attempt: " + new Date(lastRefresh.fetched_at).toLocaleTimeString() + ")";
      } else {
        heartbeat.title = "Stale -- no refresh has completed yet";
      }
    }

    // --- Flight-record history navigation ---------------------------------
    // `timeline` is every successfully-parsed flight/block the database has
    // (past and future), sorted chronologically. `browseAnchor === null`
    // means "live" mode: the top row always tracks the true current flight
    // (recomputed every poll), with the next four records below it. Once a
    // nav button is clicked, browseAnchor pins a five-record sliding window
    // into `timeline` and the board stops following live position changes
    // until "Current Flight" is pressed again.
    let timeline = [];
    let liveCurrentKey = null;
    let browseAnchor = null;

    async function fetchTimeline() {
      try {
        const res = await fetch("/api/timeline", { cache: "no-store" });
        timeline = await res.json();
      } catch (err) {
        // Keep the previous timeline on failure -- navigation just won't
        // see new records until the next successful poll.
      }
    }

    function timelineIndexOf(occurrenceKey) {
      if (!occurrenceKey) return -1;
      return timeline.findIndex((f) => f.occurrence_key === occurrenceKey);
    }

    function currentWindowStart() {
      if (browseAnchor !== null) {
        return Math.max(0, Math.min(Math.max(0, timeline.length - 1), browseAnchor));
      }
      const idx = timelineIndexOf(liveCurrentKey);
      return idx >= 0 ? idx : 0;
    }

    // Mirrors flight_state.select_current_and_next()'s is_expired() check:
    // arrival (already the AeroAPI-adjusted effective arrival when in live
    // mode, since /api/timeline runs every record through the same
    // _flight_to_view() the current/next API does) plus the grace window.
    // BLOCK rows have no arr_dt_utc-driven expiry in the traditional sense
    // -- they stay "expired" once their span's end passes, same math works.
    function isExpired(flight, nowMs) {
      if (!flight || !flight.arr_dt_utc) return false;
      return nowMs >= new Date(flight.arr_dt_utc).getTime() + GRACE_MS;
    }

    // The live (non-browsing) board should show the same "skip anything
    // already expired" rule the backend's next-flight selection uses,
    // generalized from a single "next" to however many lookahead rows fit
    // (ROWS - 1) -- otherwise a flight that has already arrived but sits
    // chronologically right after "current" in the raw timeline (e.g.
    // sandwiched inside a long-spanning BLOCK's date range) shows up as if
    // it were still upcoming, disagreeing with what /api/status itself
    // reports as "next". The pinned current record is always kept even if
    // it reads as expired by this same check (a BLOCK's own end-of-span
    // "expiry" doesn't mean it should vanish from the top row).
    function liveDisplayList() {
      const nowMs = Date.now();
      return timeline.filter(
        (f) => f.occurrence_key === liveCurrentKey || !isExpired(f, nowMs)
      );
    }

    function renderTable() {
      const rowsHtml = [];
      let start;
      if (browseAnchor !== null) {
        start = currentWindowStart();
        for (let i = 0; i < ROWS; i++) {
          const flight = timeline[start + i] ?? null;
          rowsHtml.push(renderRow(flight, !!flight && flight.occurrence_key === liveCurrentKey));
        }
      } else {
        const list = liveDisplayList();
        const idx = list.findIndex((f) => f.occurrence_key === liveCurrentKey);
        start = idx >= 0 ? idx : 0;
        for (let i = 0; i < ROWS; i++) {
          const flight = list[start + i] ?? null;
          rowsHtml.push(renderRow(flight, !!flight && flight.occurrence_key === liveCurrentKey));
        }
        // Nav button enable/disable still reasons about the raw timeline
        // (browsing isn't restricted to non-expired records), so recompute
        // that separately from what actually got rendered above.
        start = currentWindowStart();
      }
      document.getElementById("flifo-rows").innerHTML = rowsHtml.join("");
      updateNavButtons(start);
    }

    function updateNavButtons(start) {
      document.getElementById("nav-current").classList.toggle("is-live", browseAnchor === null);
      document.getElementById("nav-back").disabled = timeline.length === 0 || start <= 0;
      document.getElementById("nav-forward").disabled = timeline.length === 0 || start >= timeline.length - 1;
    }

    function enterLiveMode() {
      browseAnchor = null;
      renderTable();
      refreshBoard();
    }

    function stepBrowse(delta) {
      if (timeline.length === 0) return;
      const anchor = browseAnchor !== null ? browseAnchor : currentWindowStart();
      browseAnchor = Math.max(0, Math.min(timeline.length - 1, anchor + delta));
      renderTable();
    }

    document.getElementById("nav-back").addEventListener("click", () => stepBrowse(-1));
    document.getElementById("nav-forward").addEventListener("click", () => stepBrowse(1));
    document.getElementById("nav-current").addEventListener("click", enterLiveMode);

    async function refreshBoard() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const data = await res.json();
        liveCurrentKey = data.current ? data.current.occurrence_key : null;

        document.getElementById("last-updated").textContent =
          "Last updated: " + new Date(data.generated_at).toLocaleTimeString();
        updateHeartbeat(data.last_refresh);
        document.getElementById("sim-banner").style.display =
          data.data_mode === "simulated" ? "flex" : "none";

        await fetchTimeline();
        renderTable();
      } catch (err) {
        document.getElementById("last-updated").textContent = "Last updated: (error refreshing)";
        updateHeartbeat(null);
      }
    }

    function tickClock() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }

    tickClock();
    setInterval(tickClock, 1000);
    refreshBoard();
    setInterval(refreshBoard, REFRESH_MS);
  </script>
</body>
</html>
